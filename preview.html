<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formula Racing Camp Book Preview</title>
<meta name="description" content="Preview sample pages from Formula Racing Camp, a student-created Formula 1 learning book for kids.">
<link rel="canonical" href="https://www.formularacingcamp.com/preview">
<meta property="og:title" content="Formula Racing Camp Book Preview">
<meta property="og:description" content="Preview sample pages from the Formula Racing Camp educational racing book.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.formularacingcamp.com/preview">
<meta property="og:image" content="https://www.formularacingcamp.com/assets/site/book-cover.webp">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Formula Racing Camp Book Preview">
<meta name="twitter:description" content="Preview sample pages from the Formula Racing Camp educational racing book.">
<meta name="twitter:image" content="https://www.formularacingcamp.com/assets/site/book-cover.webp">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
body {
margin: 0;
font-family: Arial, sans-serif;
background: #f8f9fa;
color: #1f2937;
}

main {
max-width: 960px;
margin: 0 auto;
padding: 2rem 1rem;
}

a {
color: #0066cc;
font-weight: 700;
}

.preview-frame {
width: 100%;
height: min(80vh, 920px);
border: 2px solid #d1d5db;
border-radius: 8px;
background: #ffffff;
}

.preview-shell {
position: relative;
}

.preview-loading {
position: absolute;
inset: 2px;
display: grid;
place-items: center;
border-radius: 6px;
background: #ffffff;
transition: opacity 180ms ease;
pointer-events: none;
}

.preview-loading::before {
content: "";
width: 44px;
height: 44px;
border: 5px solid #dbeafe;
border-top-color: #0096ff;
border-radius: 50%;
animation: preview-spin 800ms linear infinite;
}

.preview-shell.is-loaded .preview-loading {
opacity: 0;
visibility: hidden;
}

@keyframes preview-spin {
to {
transform: rotate(360deg);
}
}
</style>
</head>
<body>
<main>
<p><a href="/">Formula Racing Camp</a></p>
<h1>Formula Racing Camp Book Preview</h1>
<p>Read sample pages from the Formula Racing Camp educational racing book for kids.</p>
<div class="preview-shell" id="preview-shell">
<object class="preview-frame" data="/assets/site/formula-racing-camp-book-preview.pdf" type="application/pdf" onload="document.getElementById('preview-shell').classList.add('is-loaded')">
<p>The preview PDF is embedded on this page.</p>
</object>
<div class="preview-loading" aria-label="Loading preview"></div>
</div>
</main>
</body>
</html>
