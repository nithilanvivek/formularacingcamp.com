<html lang="en">
<head>

<title>Page Not Found | Formula Racing Camp</title>
<meta name="description" content="This Formula Racing Camp page could not be found. Return to the homepage and get back on track.">
<meta name="robots" content="noindex, follow">
<meta name="theme-color" content="#f4f3ee" id="theme-color">
<link rel="icon" type="image/webp" href="/assets/site/f1-camp-logo-transparent.webp?v=20260731-webp1">

<script>
(function () {
  var savedTheme = null;

  try {
    savedTheme = window.localStorage.getItem('frc-error-theme');
  } catch (error) {
    savedTheme = null;
  }

  document.documentElement.dataset.theme = savedTheme === 'dark' ? 'dark' : 'light';
}());
</script>
<style>
:root {
  color-scheme: light;
  --background: #f4f3ee;
  --text: #17191d;
  --muted: #6f706f;
  --line: #cbc9c2;
  --mint: #16785a;
  --glow-left: rgba(54, 163, 135, 0.12);
  --glow-right: rgba(204, 87, 120, 0.1);
  --surface: #ffffff;
  --surface-soft: #e9e8e3;
  --border: #cfcdc6;
  --button-text: #62635f;
  --primary-text: #175d49;
  --primary-bg: rgba(35, 115, 88, 0.08);
  --primary-border: #2c8065;
  --menu-shadow: 0 18px 50px rgba(31, 34, 38, 0.14);
}

html[data-theme="dark"] {
  color-scheme: dark;
  --background: #0d1012;
  --text: #f0ede8;
  --muted: #8e8c89;
  --line: #393a3c;
  --mint: #4ed2a2;
  --glow-left: rgba(24, 91, 79, 0.14);
  --glow-right: rgba(105, 30, 56, 0.12);
  --surface: #151719;
  --surface-soft: #1c1e22;
  --border: #303136;
  --button-text: #aaa8a5;
  --primary-text: #e7e4df;
  --primary-bg: rgba(35, 95, 78, 0.12);
  --primary-border: #237358;
  --menu-shadow: 0 18px 50px rgba(0, 0, 0, 0.34);
}

* {
  box-sizing: border-box;
}

html,
body {
  min-height: 100%;
}

body {
  margin: 0;
  color: var(--text);
  background:
    radial-gradient(circle at 9% 21%, var(--glow-left), transparent 31rem),
    radial-gradient(circle at 91% 18%, var(--glow-right), transparent 31rem),
    var(--background);
  font-family: Georgia, "Times New Roman", serif;
}

.page-shell {
  width: min(100% - 3rem, 1660px);
  min-height: 100vh;
  margin-inline: auto;
  display: grid;
  grid-template-rows: auto 1fr;
}

.site-header {
  position: relative;
  z-index: 10;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  padding-top: clamp(1.5rem, 3.5vw, 2.25rem);
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 0.8rem;
  color: var(--text);
  font-family: Fredoka, sans-serif;
  font-size: clamp(1.2rem, 2vw, 1.75rem);
  font-weight: 700;
  letter-spacing: 0.01em;
  line-height: 1;
  text-decoration: none;
}

.brand:hover,
.brand:focus-visible {
  color: var(--mint);
}

.brand img {
  width: clamp(44px, 5vw, 58px);
  height: clamp(44px, 5vw, 58px);
  object-fit: contain;
  border-radius: 50%;
  clip-path: circle(48% at 50% 50%);
  filter: saturate(0.82) brightness(1.05);
}

.menu-wrap {
  position: relative;
}

.menu-button {
  width: 48px;
  height: 48px;
  display: grid;
  place-content: center;
  gap: 5px;
  padding: 0;
  color: var(--text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 50%;
  cursor: pointer;
}

.menu-button span {
  width: 22px;
  height: 2px;
  display: block;
  background: currentColor;
  border-radius: 999px;
  transition: transform 160ms ease, opacity 160ms ease;
}

.menu-button:hover {
  background: var(--surface-soft);
  border-color: var(--border);
}

.menu-button[aria-expanded="true"] span:nth-child(1) {
  transform: translateY(7px) rotate(45deg);
}

.menu-button[aria-expanded="true"] span:nth-child(2) {
  opacity: 0;
}

.menu-button[aria-expanded="true"] span:nth-child(3) {
  transform: translateY(-7px) rotate(-45deg);
}

.theme-menu {
  position: absolute;
  top: calc(100% + 0.7rem);
  right: 0;
  width: min(280px, calc(100vw - 2rem));
  padding: 1rem;
  color: var(--text);
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 16px;
  box-shadow: var(--menu-shadow);
}

.theme-menu[hidden] {
  display: none;
}

.theme-menu-title {
  margin: 0 0 0.75rem;
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 0.72rem;
  font-weight: 500;
  letter-spacing: 0.18em;
  text-transform: uppercase;
}

.theme-options {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.5rem;
  padding: 0.3rem;
  background: var(--surface-soft);
  border-radius: 12px;
}

.theme-option {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.45rem;
  padding: 0.55rem 0.75rem;
  color: var(--button-text);
  background: transparent;
  border: 1px solid transparent;
  border-radius: 9px;
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 0.78rem;
  font-weight: 500;
  cursor: pointer;
}

.theme-option[aria-pressed="true"] {
  color: var(--text);
  background: var(--surface);
  border-color: var(--border);
  box-shadow: 0 2px 8px rgba(25, 28, 32, 0.08);
}

main {
  min-height: 0;
  display: grid;
  place-items: center;
  padding: 2rem 1rem clamp(4rem, 9vh, 7rem);
}

.error-content {
  width: min(100%, 980px);
  text-align: center;
}

.error-mark {
  position: relative;
  width: min(100%, 560px);
  height: 245px;
  margin: 0 auto 0.5rem;
  display: grid;
  place-items: center;
}

.orbit {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  overflow: visible;
}

.orbit ellipse {
  fill: none;
  stroke: var(--line);
  stroke-width: 1.5;
}

.orbit .dot-blue {
  fill: #4a91e7;
}

.orbit .dot-mint {
  fill: var(--mint);
}

.status-code {
  position: relative;
  z-index: 1;
  margin: 0;
  padding-bottom: 0.08em;
  color: transparent;
  background: linear-gradient(105deg, #f06563 6%, #ffab32 37%, #4ed2a2 68%, #438ce8 96%);
  background-clip: text;
  -webkit-background-clip: text;
  font-family: Georgia, "Times New Roman", serif;
  font-size: clamp(7.5rem, 18vw, 12.5rem);
  font-weight: 700;
  line-height: 0.8;
  letter-spacing: -0.09em;
}

.spark {
  position: absolute;
  z-index: 2;
  font-family: Arial, sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
}

.spark-left {
  top: 10%;
  left: 9%;
  color: #ed6478;
}

.spark-right {
  right: 11%;
  bottom: 3%;
  color: #ffad32;
}

.eyebrow {
  margin: 0 0 1.7rem;
  color: var(--muted);
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 0.8rem;
  font-weight: 500;
  letter-spacing: 0.28em;
  text-transform: uppercase;
}

h1 {
  max-width: 940px;
  margin: 0 auto;
  font-family: "Playfair Display", Georgia, serif;
  font-size: clamp(2.7rem, 6.2vw, 5.1rem);
  line-height: 1.08;
  letter-spacing: -0.035em;
  text-wrap: balance;
}

.explanation {
  margin: 1.8rem auto 0;
  color: var(--muted);
  font-size: clamp(1.05rem, 2vw, 1.35rem);
  line-height: 1.65;
}

.requested-path {
  display: inline-block;
  margin-inline: 0.18em;
  padding: 0.04em 0.28em 0.1em;
  color: var(--text);
  background: var(--surface-soft);
  border: 1px solid var(--border);
  border-radius: 0.28rem;
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 0.85em;
}

.actions {
  margin-top: 2rem;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 0.8rem;
}

.button {
  min-height: 52px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.75rem;
  padding: 0.8rem 1.25rem;
  color: var(--button-text);
  background: transparent;
  border: 1px solid var(--border);
  border-radius: 999px;
  font-family: "DM Mono", ui-monospace, monospace;
  font-size: 0.9rem;
  font-weight: 500;
  text-decoration: none;
  cursor: pointer;
  transition: border-color 160ms ease, color 160ms ease, background-color 160ms ease;
}

.button-primary {
  color: var(--primary-text);
  background: var(--primary-bg);
  border-color: var(--primary-border);
}

.button:hover,
.button:focus-visible {
  color: var(--text);
  border-color: var(--muted);
}

.button-primary:hover,
.button-primary:focus-visible {
  color: var(--text);
  background: rgba(35, 115, 88, 0.22);
  border-color: var(--mint);
}

.button:focus-visible,
.brand:focus-visible,
.menu-button:focus-visible,
.theme-option:focus-visible {
  outline: 2px solid var(--mint);
  outline-offset: 4px;
}

@media (max-width: 640px) {
  .page-shell {
    width: min(100% - 2rem, 1660px);
  }

  main {
    align-items: start;
    padding-inline: 0;
    padding-top: 3.25rem;
  }

  .error-mark {
    height: 180px;
  }

  .eyebrow {
    margin-top: 0.5rem;
    margin-bottom: 1.2rem;
  }

  .explanation {
    margin-top: 1.35rem;
  }
}

@media (max-width: 480px) {
  .brand {
    gap: 0.5rem;
    font-size: 0.85rem;
  }

  .brand img {
    width: 40px;
    height: 40px;
  }
}

@media (max-height: 760px) and (min-width: 641px) {
  .site-header {
    padding-top: 1.35rem;
  }

  main {
    padding-top: 1rem;
    padding-bottom: 2rem;
  }

  .error-mark {
    height: 195px;
  }

  .eyebrow {
    margin-bottom: 1rem;
  }

  h1 {
    font-size: clamp(2.7rem, 5vw, 4.3rem);
  }

  .explanation {
    margin-top: 1rem;
  }

  .actions {
    margin-top: 1.35rem;
  }
}
</style>
<script defer src="/_vercel/insights/script.js"></script>
</head>
<body>
<div class="page-shell">
<header class="site-header">
<a class="brand" href="/" aria-label="Back to Formula Racing Camp homepage">
<img src="/assets/site/f1-camp-logo-transparent.webp" alt="" width="58" height="58">
<span>FORMULA RACING CAMP</span>
</a>
<div class="menu-wrap" id="menu-wrap">
<button class="menu-button" id="menu-button" type="button" aria-label="Open appearance menu" aria-controls="theme-menu" aria-expanded="false">
<span></span>
<span></span>
<span></span>
</button>
<nav class="theme-menu" id="theme-menu" aria-label="Appearance settings" hidden>
<p class="theme-menu-title">Appearance</p>
<div class="theme-options" role="group" aria-label="Color mode">
<button class="theme-option" type="button" data-theme-option="light" aria-pressed="true"><span aria-hidden="true">☀</span> Light</button>
<button class="theme-option" type="button" data-theme-option="dark" aria-pressed="false"><span aria-hidden="true">☾</span> Dark</button>
</div>
</nav>
</div>
</header>

<main>
<section class="error-content" aria-labelledby="page-title">
<div class="error-mark" aria-hidden="true">
<svg class="orbit" viewBox="0 0 560 245" role="presentation">
<ellipse cx="280" cy="124" rx="267" ry="92" transform="rotate(-7 280 124)"></ellipse>
<circle class="dot-blue" cx="481" cy="57" r="4"></circle>
<circle class="dot-mint" cx="513" cy="93" r="8"></circle>
</svg>
<span class="spark spark-left">+</span>
<p class="status-code">404</p>
<span class="spark spark-right">+</span>
</div>

<p class="eyebrow">Page not found</p>
<h1 id="page-title">Looks like this page raced off the circuit.</h1>
<p class="explanation">There is nothing at <code class="requested-path" id="requested-path">this route</code> yet. Let’s get you back on track.</p>
<div class="actions">
<a class="button button-primary" href="/">Back to home <span aria-hidden="true">→</span></a>
<button class="button" type="button" id="go-back">Go back</button>
</div>
</section>
</main>
</div>

<script>
(function () {
  var requestedPath = document.getElementById('requested-path');
  var goBack = document.getElementById('go-back');
  var menuWrap = document.getElementById('menu-wrap');
  var menuButton = document.getElementById('menu-button');
  var themeMenu = document.getElementById('theme-menu');
  var themeColor = document.getElementById('theme-color');
  var themeOptions = document.querySelectorAll('[data-theme-option]');

  function applyTheme(theme, remember) {
    var selectedTheme = theme === 'dark' ? 'dark' : 'light';

    document.documentElement.dataset.theme = selectedTheme;
    themeColor.setAttribute('content', selectedTheme === 'dark' ? '#0d1012' : '#f4f3ee');
    themeOptions.forEach(function (option) {
      option.setAttribute('aria-pressed', String(option.dataset.themeOption === selectedTheme));
    });

    if (remember) {
      try {
        window.localStorage.setItem('frc-error-theme', selectedTheme);
      } catch (error) {
        // The selected theme still applies for this visit when storage is unavailable.
      }
    }
  }

  function setMenuOpen(open) {
    menuButton.setAttribute('aria-expanded', String(open));
    menuButton.setAttribute('aria-label', open ? 'Close appearance menu' : 'Open appearance menu');
    themeMenu.hidden = !open;
  }

  requestedPath.textContent = window.location.pathname || '/';
  applyTheme(document.documentElement.dataset.theme, false);

  menuButton.addEventListener('click', function () {
    setMenuOpen(menuButton.getAttribute('aria-expanded') !== 'true');
  });

  themeOptions.forEach(function (option) {
    option.addEventListener('click', function () {
      applyTheme(option.dataset.themeOption, true);
    });
  });

  document.addEventListener('click', function (event) {
    if (!menuWrap.contains(event.target)) {
      setMenuOpen(false);
    }
  });

  document.addEventListener('keydown', function (event) {
    if (event.key === 'Escape' && menuButton.getAttribute('aria-expanded') === 'true') {
      setMenuOpen(false);
      menuButton.focus();
    }
  });

  goBack.addEventListener('click', function () {
    if (window.history.length > 1) {
      window.history.back();
      return;
    }

    window.location.href = '/';
  });
}());
</script>
</body>
</html>
